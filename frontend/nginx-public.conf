# Additive public profile. Keep this route list aligned with app/public_access.py.
# Match the ORIGINAL path, before nginx URI decoding/normalization. Encoded paths,
# dot segments and duplicate slashes must not turn an unlisted path into an API.
map $request_uri $public_path_allowed {
    default 0;
    ~^/(?:\?.*)?$ 1;
    ~^/(?:index\.html|build\.json)(?:\?.*)?$ 1;
    ~^/(?:assets|cesium|textures)/(?:[A-Za-z0-9_-][A-Za-z0-9_.-]*/)*[A-Za-z0-9_-][A-Za-z0-9_.-]*(?:\?.*)?$ 1;
    ~^/api/(?:health|config|status)(?:\?.*)?$ 1;
    "~^/api/publication/observations(?:/download(?:/[0-9a-f]{64})?)?$" 1;
    "~^/api/publication/aircraft(?:/download/[0-9a-f]{64})?$" 1;
}
map $request_method $public_method_allowed {
    default 0;
    GET 1;
    HEAD 1;
}
# Only successful Vite content-hashed JS/CSS is immutable. API, HTML, Cesium
# unversioned resources, and errors retain no-store; no report cache is created.
map "$status:$uri" $public_cache_control {
    default no-store;
    ~^200:/assets/[A-Za-z0-9_-]+-[A-Za-z0-9_-]+\.(?:js|css)$ "public, max-age=31536000, immutable";
}
# Local profile trusts no forwarding header. The optional hosted profile mounts
# a narrowly scoped connector trust policy; both profiles use the same routes.
include /etc/nginx/public-edge-http/*.conf;
map $uri $public_download_key {
    default "";
    "~^/api/publication/(?:observations/download(?:/[0-9a-f]{64})?|aircraft/download/[0-9a-f]{64})$" $binary_remote_addr;
}
map $public_download_key $public_download_rate {
    "" 0;
    default 512k;
}
map $public_download_key $public_download_global_key {
    "" "";
    default $server_name;
}
limit_conn_zone $public_download_global_key zone=public_download_total_connections:10m;
limit_req_zone $binary_remote_addr zone=public_api_rate:10m rate=5r/s;
limit_req_zone $public_download_key zone=public_download_rate:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=public_connections:10m;
limit_conn_zone $public_download_key zone=public_download_connections:10m;
limit_conn_zone $server_name zone=public_total_connections:10m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log off;
    add_header_inherit merge;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Cache-Control $public_cache_control always;
    client_max_body_size 1k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 20s;
    send_timeout 20s;
    # Public read-only text/data only; bounded work and buffers. Raster imagery,
    # audio and video are excluded. nginx also compresses its default text/html.
    gzip on;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_buffers 16 8k;
    gzip_vary on;
    gzip_proxied any;
    gzip_types application/json application/javascript text/javascript text/css image/svg+xml application/wasm;
    limit_req_status 429;
    limit_conn_status 429;

    include /etc/nginx/public-edge-server/*.conf;

    if ($public_method_allowed = 0) { return 405; }
    if ($public_path_allowed = 0) { return 404; }

    location /api/ {
        limit_req zone=public_api_rate burst=40 nodelay;
        limit_req zone=public_download_rate burst=2 nodelay;
        limit_conn public_connections 32;
        limit_conn public_download_connections 1;
        limit_conn public_total_connections 32;
        limit_conn public_download_total_connections 4;
        limit_rate $public_download_rate;
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        # No cookies, Authorization, X-Admin-Key, arbitrary forwarding headers or
        # request bodies cross the public boundary. Only these headers are sent.
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header Accept application/json;
        proxy_set_header Connection "";
        proxy_hide_header Set-Cookie;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
        proxy_connect_timeout 5s;
        proxy_max_temp_file_size 0;
    }
    location /assets/ { try_files $uri =404; }
    location /cesium/ { try_files $uri =404; }
    location /textures/ { try_files $uri =404; }
    location = /build.json { try_files $uri =404; }
    location = /index.html { try_files $uri =404; }
    location = / { try_files /index.html =404; }
    location / { return 404; }
}
