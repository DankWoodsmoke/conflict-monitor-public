              ap_require(soak['candidate_receipt_sha256']==candidate,'Soak candidate differs')
              for name in ['google_operator','google_public','media_replay']:
                  ap_require(proofs[name]['candidate_receipt_sha256']==candidate,'Browser candidate differs')
              ap_require(proofs['backup_restore']['backup_restore']['candidate_receipt_sha256']==candidate,'Restore candidate differs')
              operator,public=proofs['google_operator'],proofs['google_public']
              ap_require(operator['binding_review']==public['binding_review'] and operator['browser_manifest_sha256']==public['browser_manifest_sha256'],'Matrix source/addendum binding differs')
              for key in ['summary_sha256','samples_sha256']:
                  ap_require(operator['supplemental_raster'][key]!=public['supplemental_raster'][key],'Separate operator/public raster executions required')
              for key in ['source_receipt_sha256','observer_sha256','raster_helper_sha256']:
                  ap_require(operator['supplemental_raster'][key]==public['supplemental_raster'][key],'Raster parent/source binding differs')
              for proof in [operator,public]:
                  raster=proof['supplemental_raster']
                  ap_require(raster['observed_services']==soak['observed_services'],'Supplemental raster must observe the same stable service incarnations')
                  ap_require(ap_clock(security['final_refresh']['started_at'])>ap_clock(raster['ended_at']),'Final security refresh must follow both independent raster soaks')
              return True
          # END SCOPED BROWSER AND RESTORE POLICY
          
          
          def qualify(snapshots,version):
              if READY not in snapshots or MANIFEST not in snapshots:raise ValueError('Final local qualification is absent')
              ready=strict_json(snapshots[READY]);declared=strict_json(snapshots[MANIFEST])
              if type(ready) is not dict or type(ready.get('schema')) is not int or ready.get('schema')!=1 or ready.get('ready') is not True or ready.get('prerelease') is not True:raise ValueError('Final local qualification is not ready')
              if ready.get('repository')!=REPOSITORY or ready.get('release_ref')!=BRANCH or ready.get('version')!=version or version!=VERSION:raise ValueError('Release identity differs')
              if set(ready)!={'schema','ready','prerelease','repository','release_ref','version','source_manifest_sha256','runtime_source_sha256','images','evidence','limitations'}:raise ValueError('Unexpected readiness fields')
              rows=file_rows(snapshots)
              if type(declared) is not dict or set(declared)!={'schema','files'} or type(declared['schema']) is not int or declared['schema']!=1 or type(declared['files']) is not list:raise ValueError('Source manifest schema differs')
              for row in declared['files']:
                  if type(row) is not dict or set(row)!={'path','bytes','sha256'} or type(row['path']) is not str or not exact_int(row['bytes']) or not valid_sha(row['sha256']):raise ValueError('Source inventory field types differ')
              if declared!={'schema':1,'files':rows}:raise ValueError('Source inventory differs, including additions or omissions')
              if ready.get('source_manifest_sha256')!=checksum(snapshots[MANIFEST]):raise ValueError('Source manifest digest differs')
              runtime=[r for r in rows if r['path'].startswith(RUNTIME_PREFIXES) or r['path'] in RUNTIME_FILES]
              if not RUNTIME_FILES<={r['path'] for r in runtime}:raise ValueError('Runtime profile inventory incomplete')
              runtime_hash=checksum(canonical(runtime))
              if ready.get('runtime_source_sha256')!=runtime_hash:raise ValueError('Qualified runtime source differs')
              images=ready.get('images',{})
              if type(images) is not dict or set(images)!=ROLES or not all(type(v) is str and re.fullmatch(r'sha256:[0-9a-f]{64}',v) for v in images.values()):raise ValueError('Five immutable runtime image identities required')
              proofs=ready.get('evidence',{})
              if set(proofs)!=GATES:raise ValueError('Required evidence inventory incomplete')
              admitted_proofs={}
              for name,reference in proofs.items():
                  if type(reference) is not dict or set(reference)!={'path','sha256'}:raise ValueError('Evidence reference schema differs')
                  path=reference.get('path','')
                  if not re.fullmatch(r'docs/qualification/[A-Za-z0-9_.-]+\.json',path) or path in {READY,MANIFEST} or path not in snapshots:raise ValueError('Evidence must be a committed sanitized projection')
                  if reference.get('sha256')!=checksum(snapshots[path]):raise ValueError('Evidence digest differs')
                  proof=strict_json(snapshots[path])
                  if type(proof) is not dict:raise ValueError('Evidence must be an object')
                  accepted={'PASS','QUALIFIED_WITH_LIMITATIONS'} if name=='media_replay' else {'PASS'}
                  if proof.get('status') not in accepted or proof.get('runtime_source_sha256')!=runtime_hash or proof.get('qualified_images')!=images:raise ValueError('Evidence outcome or source/image identity differs')
                  if not valid_sha(proof.get('source_receipt_sha256')) or proof.get('execution') not in {'fresh','rebound'}:raise ValueError('Original execution evidence required')
                  if proof['execution']=='rebound' and not valid_sha(proof.get('equivalence_sha256')):raise ValueError('Historical evidence requires explicit equivalence proof')
                  admitted_proofs[name]=proof
                  if name=='full_pipeline_soak':ap_validate_soak(proof)
                  if name=='security':ap_validate_security(proof)
                  if name in {'google_operator','google_public'}:ev_validate_google(proof,name)
                  if name=='media_replay':ev_validate_media(proof)
                  if name=='backup_restore':ev_validate_backup(proof)
              ap_validate_pair(admitted_proofs['security'],admitted_proofs['full_pipeline_soak'])
              ev_validate_proof_set(admitted_proofs)
              limits=ready.get('limitations')
              if not isinstance(limits,list) or not 1<=len(limits)<=20 or any(not isinstance(x,str) or not 1<=len(x)<=600 or '\n' in x for x in limits):raise ValueError('Bounded explicit release limitations required')
              return ready
          
          
          def release_notes(version,commit,limitations):
              intro=('RC.5 brings Google Earth imagery and clearer source-specific identifiers into one workspace. '
                     'Public context uses separate NASA FIRMS thermal observations and ADSB.lol snapshots, with attribution and downloads of the exact published batches. '
                     'Reconnect and recovery repairs, restricted public access and native dependency fixes are covered by the scoped browser, pipeline and four-hour qualification recorded with this prerelease.')
              return (intro+'\n\nVerified source prerelease '+version+'\n\nSource commit: '+commit+'\n\n'+'\n'.join('- '+item for item in limitations)+'\n').encode('utf-8')
          
          
          def ci_identity(run_id,attempt):
              if not re.fullmatch(r'[1-9][0-9]{0,19}',str(run_id)) or not re.fullmatch(r'[1-9][0-9]{0,4}',str(attempt)):raise ValueError('Exact hosted run identity required')
              return {'run_id':str(run_id),'run_attempt':str(attempt),'url':'https://github.com/'+REPOSITORY+'/actions/runs/'+str(run_id)}
          # END REVIEWED PURE POLICY
          
          def digest(data):return sha256(data).hexdigest()
          
          
          def validate(folder,env):
              if env['GITHUB_EVENT_NAME']!='push' or env['GITHUB_REF']!='refs/heads/codex/public-release' or env['GITHUB_REPOSITORY']!='DankWoodsmoke/conflict-monitor-public' or env['GITHUB_ACTOR']!='DankWoodsmoke':raise ValueError('Untrusted publisher trigger')
              commit=env['GITHUB_SHA']
              if not re.fullmatch(r'[0-9a-f]{40}',commit):raise ValueError('Invalid source commit')
              items=list(folder.iterdir())
              if len(items)!=4 or any(p.is_symlink() or not p.is_file() for p in items):raise ValueError('Unexpected artifact entry')
              raw=(folder/'verification.json').read_bytes()
              if len(raw)>100_000 or digest(raw)!=env['EXPECTED_VERIFICATION_SHA256']:raise ValueError('Verification asset digest differs')
              verification=strict_json(raw);tag=verification.get('tag','')
              if not re.fullmatch(r'v\d+\.\d+\.\d+-rc\.\d+',tag) or tag!=env['EXPECTED_TAG']:raise ValueError('Tag identity differs')
              if verification.get('status')!='READY_FOR_PRERELEASE' or verification.get('source_commit')!=commit or verification.get('repository')!=env['GITHUB_REPOSITORY'] or verification.get('release_ref')!=env['GITHUB_REF']:raise ValueError('Publication identity differs')
              run_id,attempt=env['GITHUB_RUN_ID'],env['GITHUB_RUN_ATTEMPT']
              if not re.fullmatch(r'[1-9][0-9]{0,19}',run_id) or not re.fullmatch(r'[1-9][0-9]{0,4}',attempt):raise ValueError('Invalid hosted run identity')
              if verification.get('ci')!={'run_id':run_id,'run_attempt':attempt,'url':'https://github.com/'+env['GITHUB_REPOSITORY']+'/actions/runs/'+run_id}:raise ValueError('Same-run hosted verification identity differs')
              filename='conflict-monitor-'+tag[1:]+'-source.zip'
              if {p.name for p in items}!={filename,filename+'.sha256','verification.json','RELEASE_NOTES.txt'}:raise ValueError('Unexpected asset names')
              package=folder/filename
              if package.stat().st_size>128*1024**2:raise ValueError('Archive exceeds budget')
              data=package.read_bytes()
              if digest(data)!=env['EXPECTED_ARCHIVE_SHA256'] or verification.get('archive')!={'name':filename,'bytes':len(data),'sha256':digest(data)}:raise ValueError('Archive handoff digest differs')
              if (folder/(filename+'.sha256')).read_bytes()!=(digest(data)+'  '+filename+'\n').encode():raise ValueError('Checksum asset differs')
              notes=(folder/'RELEASE_NOTES.txt').read_bytes()
              if not 1<=len(notes)<=16_000 or digest(notes)!=verification.get('release_notes_sha256'):raise ValueError('Release notes differ or exceed budget')
              with zipfile.ZipFile(package) as archive:
                  entries=archive.infolist();names=[e.filename for e in entries]
                  if not 1<=len(entries)<=2000 or len(set(names))!=len(names) or sum(e.file_size for e in entries)>512*1024**2:raise ValueError('Archive entry budget/uniqueness failed')
                  for item in entries:
                      name=PurePosixPath(item.filename)
                      if not item.filename.startswith('conflict-monitor/') or name.is_absolute() or '..' in name.parts or '\\' in item.filename or str(name)!=item.filename or item.file_size>32*1024**2 or stat.S_ISLNK(item.external_attr>>16):raise ValueError('Unsafe archive entry')
                      expected_mode=0o100755 if item.filename.endswith('.sh') else 0o100644
                      if item.external_attr>>16!=expected_mode or item.create_system!=3 or item.date_time!=(2020,1,1,0,0,0) or item.compress_type!=zipfile.ZIP_DEFLATED or item.flag_bits&1 or item.extra or item.comment:raise ValueError('Archive mode or deterministic metadata differs')
                  manifest=strict_json(archive.read('conflict-monitor/RELEASE_MANIFEST.json'))
                  if manifest.get('status')!='candidate' or manifest.get('version')!=tag[1:]:raise ValueError('Archive release identity differs')
                  expected={r['path'] for r in manifest['files']}
                  if len(expected)!=len(manifest['files']) or set(names)!={'conflict-monitor/'+n for n in expected}|{'conflict-monitor/RELEASE_MANIFEST.json'}:raise ValueError('Archive source inventory differs')
                  for row in manifest['files']:
                      if type(row) is not dict or set(row)!={'path','bytes','sha256'} or type(row['bytes']) is not int or row['bytes']<0 or not valid_sha(row['sha256']):raise ValueError('Archive inventory schema differs')
                      body=archive.read('conflict-monitor/'+row['path'])
                      if row!={'path':row['path'],'bytes':len(body),'sha256':digest(body)}:raise ValueError('Archive source bytes differ')
                  snapshots={row['path']:archive.read('conflict-monitor/'+row['path']) for row in manifest['files']}
                  ready=qualify(snapshots,tag[1:])
                  if digest(snapshots[READY])!=verification['ready_receipt_sha256']:raise ValueError('Ready receipt handoff differs')
                  for key in ['source_manifest_sha256','runtime_source_sha256','images','evidence','limitations']:
                      if ready[key]!=verification.get(key):raise ValueError('Qualification handoff differs')
                  if notes!=release_notes(tag[1:],commit,ready['limitations']):raise ValueError('Release notes differ from qualified source content')
              return verification
          
          
          def api(path,token,expected=200):
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self,*_):raise ValueError('GitHub API redirect refused')
              request=urllib.request.Request('https://api.github.com/'+path,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirect())
              try:
                  with opener.open(request,timeout=30) as response:status=response.status;raw=response.read(1024**2+1)
              except urllib.error.HTTPError as error:
                  status=error.code;raw=b''
              if status!=expected:raise ValueError('GitHub API state differs; HTTP '+str(status))
              if len(raw)>1024**2:raise ValueError('GitHub API response exceeds budget')
              return strict_json(raw) if raw else None
          
          
          def current_head(repo,token,commit):
              head=api(f'repos/{repo}/git/ref/heads/codex/public-release',token)
              if head.get('object',{}).get('sha')!=commit or head.get('object',{}).get('type')!='commit':raise ValueError('Trusted branch HEAD moved; refusing stale publication')
          
          
          def remote_download(folder,repo,tag,assets,env,observations,save):
              with tempfile.TemporaryDirectory(prefix='verified-release-download-') as temporary:
                  command=['gh','release','download',tag,'--repo',repo,'--dir',temporary]
                  for asset in assets:command+=['--pattern',asset.name]
                  result=subprocess.run(command,capture_output=True,env=env,timeout=180)
                  if result.returncode:raise ValueError('Independent release download failed')
                  actual=list(Path(temporary).iterdir())
                  if {p.name for p in actual}!={p.name for p in assets} or any(p.is_symlink() or not p.is_file() for p in actual):raise ValueError('Downloaded asset inventory differs')
                  for asset in assets:
                      local=asset.read_bytes();downloaded=Path(temporary)/asset.name
                      row={'name':asset.name,'expected_bytes':len(local),'downloaded_bytes':downloaded.stat().st_size,
                           'local_sha256':digest(local),'downloaded_sha256':None,'matches':False}
                      observations.append(row);save()
                      if row['downloaded_bytes']!=len(local):raise ValueError('Released download size differs')
                      downloaded_bytes=downloaded.read_bytes();row['downloaded_sha256']=digest(downloaded_bytes)
                      row['matches']=downloaded_bytes==local;save()
                      if not row['matches']:raise ValueError('Released download bytes differ')
          
          
          def publish(folder,env):
              report=Path(env['PUBLISHER_RECEIPT']).resolve()
              if report.parent!=folder.resolve().parent or report.name!='publication-receipt.json' or report.exists():raise ValueError('Fresh publisher receipt must be outside the admitted assets')
              receipt={'schema':1,'status':'RUNNING','stage':'admission','source_commit':env.get('GITHUB_SHA'),'ci_run_id':env.get('GITHUB_RUN_ID'),'stages':[],'remote_observations':[],
                       'scope':'Source prerelease publication only; no site deployment. Partial tag/draft state is never overwritten.'}
              def save():report.write_bytes(canonical(receipt))
              def stage(name):receipt['stage']=name;save()
              def done(name):receipt['stages'].append({'stage':name,'completed_at':datetime.now(timezone.utc).isoformat()});save()
              save()
              try:
                  value=validate(folder,env);repo=env['GITHUB_REPOSITORY'];tag=value['tag'];commit=env['GITHUB_SHA'];token=env['GH_TOKEN']
                  receipt.update(repository=repo,tag=tag,archive_sha256=value['archive']['sha256'],verification_sha256=env['EXPECTED_VERIFICATION_SHA256']);done('admission')
                  stage('absence_and_head')
                  api(f'repos/{repo}/git/ref/tags/{tag}',token,404)
                  api(f'repos/{repo}/releases/tags/{tag}',token,404)
                  current_head(repo,token,commit);done('absence_and_head')
                  stage('create_exact_tag')
                  result=subprocess.run(['gh','api','--method','POST',f'repos/{repo}/git/refs','--input','-'],input=json.dumps({'ref':'refs/tags/'+tag,'sha':commit}).encode(),capture_output=True,env=env,timeout=45)
                  if result.returncode:raise ValueError('Exact tag creation failed; no overwrite attempted')
                  created=strict_json(result.stdout)
                  if created['ref']!='refs/tags/'+tag or created['object']['type']!='commit' or created['object']['sha']!=commit:raise ValueError('Created tag differs')
                  receipt['created_tag']={'ref':created['ref'],'object_type':created['object']['type'],'commit':created['object']['sha']}
                  done('create_exact_tag')
                  assets=[folder/value['archive']['name'],folder/(value['archive']['name']+'.sha256'),folder/'verification.json']
                  stage('create_draft_prerelease')
                  command=['gh','release','create',tag,*map(str,assets),'--repo',repo,'--target',commit,'--verify-tag','--draft','--prerelease','--latest=false','--title','Conflict Monitor '+tag,'--notes-file',str(folder/'RELEASE_NOTES.txt')]
                  result=subprocess.run(command,capture_output=True,env=env,timeout=180)
                  if result.returncode:raise ValueError('Draft release creation incomplete; preserve partial state for review')
                  done('create_draft_prerelease')
                  def remote_state(draft,expected_assets,phase):
                      observed={'phase':phase,'observed_at':datetime.now(timezone.utc).isoformat(),'expected_draft':draft,
                                'expected_tag':tag,'expected_tag_commit':commit,'actual_tag_commit':None,'tag_matches':False,
                                'release_id':None,'draft':None,'prerelease':None,'assets':[],'downloads':[]}
                      receipt['remote_observations'].append(observed);save()
                      actual=api(f'repos/{repo}/git/ref/tags/{tag}',token)
                      target=actual.get('object',{});actual_commit=target.get('sha')
                      observed['actual_tag_commit']=actual_commit if type(actual_commit) is str and re.fullmatch('[a-f0-9]{40}',actual_commit) else None
                      observed['tag_matches']=target.get('type')=='commit' and actual_commit==commit;save()
                      if not observed['tag_matches']:raise ValueError('Remote tag differs from qualified commit')
                      release=api(f'repos/{repo}/releases/tags/{tag}',token)
                      observed.update(release_id=release.get('id') if type(release.get('id')) is int else None,
                                      draft=release.get('draft') if type(release.get('draft')) is bool else None,
                                      prerelease=release.get('prerelease') if type(release.get('prerelease')) is bool else None,
                                      release_tag_matches=release.get('tag_name')==tag)
                      save()
                      if type(release.get('id')) is not int or release['id']<=0 or receipt.get('release_id',release['id'])!=release['id']:raise ValueError('Remote release identity differs')
                      if release['draft'] is not draft or release['prerelease'] is not True or release['tag_name']!=tag:raise ValueError('Release visibility differs')
                      remote_assets=release.get('assets');expected={p.name:p for p in expected_assets}
                      if type(remote_assets) is not list or len(remote_assets)!=len(expected):raise ValueError('Release asset inventory differs')
                      if any(type(a) is not dict or type(a.get('name')) is not str for a in remote_assets) or {a['name'] for a in remote_assets}!=set(expected):raise ValueError('Release asset inventory differs')
                      seen=set()
                      for remote in remote_assets:
                          local=expected[remote['name']].read_bytes();wanted=digest(local);remote_digest=remote.get('digest')
                          valid_digest=remote_digest is None or type(remote_digest) is str and re.fullmatch('sha256:[a-f0-9]{64}',remote_digest) is not None
                          row={'name':remote['name'],'asset_id':remote.get('id') if type(remote.get('id')) is int else None,
                               'api_bytes':remote.get('size') if type(remote.get('size')) is int else None,
                               'expected_bytes':len(local),'local_sha256':wanted,'api_sha256':remote_digest[7:] if valid_digest and remote_digest is not None else None,
                               'api_digest_present':remote_digest is not None,'api_digest_valid':valid_digest,'uploaded':remote.get('state')=='uploaded'}
                          observed['assets'].append(row);save()
                          if row['asset_id'] is None or row['asset_id']<=0 or row['asset_id'] in seen:raise ValueError('Remote asset identity invalid')
                          seen.add(row['asset_id'])
                          if row['api_bytes']!=len(local) or not row['uploaded']:raise ValueError('Remote asset size or upload state differs')
                          if not valid_digest or remote_digest is not None and row['api_sha256']!=wanted:raise ValueError('Remote API asset digest differs')
                      return observed
                  stage('verify_draft_downloads')
                  observed=remote_state(True,assets,'draft_source_assets');receipt['release_id']=observed['release_id']
                  remote_download(folder,repo,tag,assets,env,observed['downloads'],save);done('verify_draft_downloads')
                  stage('retain_durable_draft_receipt')
                  durable_dir=folder.parent/'durable-publication-evidence';durable_dir.mkdir(mode=0o700)
                  durable=durable_dir/'publication-receipt.json'
                  # Upload before promotion so the flow also supports immutable releases.
                  # This frozen receipt never claims its own future upload or publication.
                  durable.write_bytes(canonical({**receipt,'status':'DRAFT_SOURCE_ASSETS_DOWNLOADED_VERIFIED','publication_not_yet_performed':True,
                      'scope':'Source assets verified while draft. Actual promotion and public download result are retained in the linked CI run.'}))
                  result=subprocess.run(['gh','release','upload',tag,str(durable),'--repo',repo],capture_output=True,env=env,timeout=90)
                  if result.returncode:raise ValueError('Durable draft receipt upload failed; keep release unpublished')
                  assets.append(durable);observed=remote_state(True,assets,'durable_receipt_while_draft')
                  remote_download(folder,repo,tag,[durable],env,observed['downloads'],save)
                  receipt['durable_receipt_sha256']=digest(durable.read_bytes());done('retain_durable_draft_receipt')
                  stage('promote_verified_draft')
                  current_head(repo,token,commit)
                  remote_state(True,assets,'before_promotion')
                  result=subprocess.run(['gh','release','edit',tag,'--repo',repo,'--draft=false','--prerelease','--latest=false'],capture_output=True,env=env,timeout=60)
                  if result.returncode:raise ValueError('Draft promotion failed; preserve state for review')
                  done('promote_verified_draft')
                  stage('verify_public_downloads')
                  observed=remote_state(False,assets,'published_assets')
                  remote_download(folder,repo,tag,assets,env,observed['downloads'],save);done('verify_public_downloads')
                  receipt['status']='PUBLISHED_AND_DOWNLOADED_BYTES_VERIFIED';receipt['stage']='complete';save()
                  print(json.dumps({'status':receipt['status'],'tag':tag,'source_commit':commit,'archive_sha256':value['archive']['sha256']}))
              except Exception as error:
                  receipt.update(status='INCOMPLETE_OR_FAILED',failed_stage=receipt['stage'],error_type=type(error).__name__)
                  save();raise
          
          
          if __name__=='__main__':publish(Path(os.environ['RELEASE_ASSET_DIR']),dict(os.environ))
          PY
      - name: Retain completed or partial publication evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-receipt.json
          if-no-files-found: error
          retention-days: 90
