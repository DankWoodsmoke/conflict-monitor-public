name: Verify release candidate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:compat
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.6@sha256:1ac10b2551ba84ae05db8e7da477afcd0a3fede99bcb7705da2ee157390cb095
        env:
          POSTGRES_DB: conflict_monitor_test
          POSTGRES_USER: monitor_admin
          POSTGRES_PASSWORD: fixture_only_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U monitor_admin -d conflict_monitor_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://monitor_admin:fixture_only_ci@127.0.0.1:5432/conflict_monitor_test
      LIVE_INGESTION_ENABLED: 'false'
      DEMO_MODE: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip setuptools
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m ruff check --select E9,F63,F7,F82 backend tools
      - run: python -m pytest -q
        working-directory: backend
      - name: Generate isolated runtime password
        run: |
          python - <<'PY'
          import os, secrets
          fixture_runtime_secret = secrets.token_hex(32)
          print('::add-mask::' + fixture_runtime_secret)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf8') as output:
              output.write('POSTGRES_APP_PASSWORD=' + fixture_runtime_secret + '\n')
          PY
      - run: python -m app.bootstrap
        working-directory: backend
      - name: Use restricted runtime login for integration gates
        run: |
          python - <<'PY'
          import os
          fixture_runtime_secret = os.environ['POSTGRES_APP_PASSWORD']
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf8') as output:
              output.write('DATABASE_URL=postgresql+asyncpg://monitor:' + fixture_runtime_secret + '@127.0.0.1:5432/conflict_monitor_test\n')
          PY
      - run: python tools/verify_database_role.py
      - run: python tools/verify_postgis.py
      - run: python tools/verify_live_pipeline.py
      - run: python tools/verify_event_delivery.py
      - name: Offline release-publisher admission and no-write regression tests
        run: python tools/test_release_publication.py
      - run: python tools/release_gate.py --scan-only
      - run: pip-audit
  container_profile:
    name: Shipped Compose security and pipeline profile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: cmonitor-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Prepare isolated masked fixtures
        run: |
          python - <<'PY'
          import os, re, secrets
          from pathlib import Path
          project = os.environ['COMPOSE_PROJECT_NAME']
          assert re.fullmatch(r'cmonitor-ci-[0-9]+-[0-9]+', project)
          folder = Path(os.environ['RUNNER_TEMP']) / 'conflict-monitor-compose'
          folder.mkdir(mode=0o700)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf8') as output:
              output.write('QUALIFY_DIR=' + str(folder) + '\n')
          (folder / 'reports').mkdir()
          (folder / 'empty-voice').mkdir()
          bootstrap, runtime = secrets.token_hex(32), secrets.token_hex(32)
          for value in (bootstrap, runtime):
              print('::add-mask::' + value)
          values = {
              'POSTGRES_PASSWORD': bootstrap, 'POSTGRES_APP_PASSWORD': runtime,
              'CONFLICT_ENV_FILE': str(folder / 'fixture.env'),
              'PIPER_VOICE_DIR': str(folder / 'empty-voice'),
              'FRONTEND_PORT': '0', 'BACKEND_PORT': '0',
              'LIVE_INGESTION_ENABLED': 'false', 'DEMO_MODE': 'false',
              'X_INGESTION_ENABLED': 'false', 'ENABLE_LOCAL_AI': 'false',
              'ENABLE_SITREP_GENERATION': 'false', 'ENABLE_VIDEO_GENERATION': 'false',
              'GOOGLE_EARTH_ENABLED': 'false', 'GOOGLE_MAPS_BROWSER_KEY': '',
              'ANTHROPIC_API_KEY': '', 'ADMIN_API_KEY': '',
              'TWITTER_BEARER_TOKEN': '', 'TELEGRAM_API_ID': '0',
              'TELEGRAM_API_HASH': '', 'TELEGRAM_SESSION': '',
              'AISSTREAM_API_KEY': '', 'FIRMS_MAP_KEY': '',
          }
          descriptor = os.open(folder / 'fixture.env', os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, 'w', encoding='utf8') as output:
              output.write(''.join(key + '=' + value + '\n' for key, value in values.items()))
          (folder / 'compose.override.yml').write_text('''services:
            db:
              image: ${COMPOSE_PROJECT_NAME}-db
              environment:
                POSTGRES_DB: conflict_monitor_test
              healthcheck:
                test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U monitor_admin -d conflict_monitor_test"]
            migrate:
              image: ${COMPOSE_PROJECT_NAME}-backend
              environment:
                DATABASE_URL: postgresql+asyncpg://monitor_admin:${POSTGRES_PASSWORD}@db:5432/conflict_monitor_test
            backend:
              image: ${COMPOSE_PROJECT_NAME}-backend
              environment:
                DATABASE_URL: postgresql+asyncpg://monitor:${POSTGRES_APP_PASSWORD}@db:5432/conflict_monitor_test
                PYTHONPATH: /app
                PYTHONDONTWRITEBYTECODE: "1"
              volumes:
                - type: bind
                  source: ${GITHUB_WORKSPACE}/tools
                  target: /qualification/tools
                  read_only: true
            frontend:
              image: ${COMPOSE_PROJECT_NAME}-frontend
          ''', encoding='utf8')
          PY
      - name: Build all shipped runtime images from source
        run: docker compose --env-file "$QUALIFY_DIR/fixture.env" -f docker-compose.yml -f "$QUALIFY_DIR/compose.override.yml" build db backend frontend
      - name: Initialize the isolated shipped profile
        run: docker compose --env-file "$QUALIFY_DIR/fixture.env" -f docker-compose.yml -f "$QUALIFY_DIR/compose.override.yml" up -d --no-build --wait --wait-timeout 180
      - name: Verify actual runtime permissions and PostGIS TCP pipeline
        run: |
          set -o pipefail
          for gate in verify_database_role.py verify_postgis.py verify_live_pipeline.py verify_event_delivery.py; do
            docker compose --env-file "$QUALIFY_DIR/fixture.env" -f docker-compose.yml -f "$QUALIFY_DIR/compose.override.yml" exec -T backend python "/qualification/tools/$gate" | tee "$QUALIFY_DIR/reports/$gate.log"
          done
      - name: Verify PID1, capability, mount and port boundaries
        run: |
          python tools/verify_container_boundary.py --project "$COMPOSE_PROJECT_NAME" --compose-file docker-compose.yml --override-file "$QUALIFY_DIR/compose.override.yml" --env-file "$QUALIFY_DIR/fixture.env" --database-uid 70 --output "$QUALIFY_DIR/reports/container-boundary.json"
      - name: Verify actual served security and cache headers
        run: |
          front=$(docker compose --env-file "$QUALIFY_DIR/fixture.env" -f docker-compose.yml -f "$QUALIFY_DIR/compose.override.yml" port frontend 80)
          back=$(docker compose --env-file "$QUALIFY_DIR/fixture.env" -f docker-compose.yml -f "$QUALIFY_DIR/compose.override.yml" port backend 8000)
          python tools/verify_http_headers.py --frontend-url "http://$front" --backend-url "http://$back" --output "$QUALIFY_DIR/reports/http-headers.json"
      - name: Remove ordinary operator fixture before public qualification
        run: docker compose --env-file "$QUALIFY_DIR/fixture.env" -f docker-compose.yml -f "$QUALIFY_DIR/compose.override.yml" down --volumes --remove-orphans
      - name: Build public ingress and offline connector images
        run: |
          docker build --build-arg NGINX_CONFIG=nginx-public.conf --tag "$COMPOSE_PROJECT_NAME-public" frontend
          docker pull cloudflare/cloudflared:2026.10.7@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
          docker build --tag "$COMPOSE_PROJECT_NAME-tunnel" tools/hosting
      - name: Verify public Compose, two-table reader and authored packet pipeline
        run: |
          python -m pip install httpx==0.28.1
          python tools/verify_hosting_profile.py --output "$QUALIFY_DIR/reports/hosting-profile.json"
          python tools/verify_public_profile_ci.py --backend-image "$COMPOSE_PROJECT_NAME-backend" --database-image "$COMPOSE_PROJECT_NAME-db" --operator-image "$COMPOSE_PROJECT_NAME-frontend" --public-image "$COMPOSE_PROJECT_NAME-public" --output "$QUALIFY_DIR/reports/public-compose.json"
      - name: Verify explicit ingress, gzip and offline connector provenance
        run: |
          python tools/verify_public_ingress.py --frontend-image "$COMPOSE_PROJECT_NAME-public" --backend-image "$COMPOSE_PROJECT_NAME-backend" --output "$QUALIFY_DIR/reports/public-ingress.json"
          python tools/verify_hosted_edge.py --frontend-image "$COMPOSE_PROJECT_NAME-public" --backend-image "$COMPOSE_PROJECT_NAME-backend" --output "$QUALIFY_DIR/reports/hosted-edge.json"
          tunnel_image=$(docker image inspect --format '{{.Id}}' "$COMPOSE_PROJECT_NAME-tunnel")
          python tools/verify_cloudflared_static.py --image "$tunnel_image" --output "$QUALIFY_DIR/reports/cloudflared-offline.json"
      - name: Remove generated fixture secrets from retained reports
        id: sanitize_reports
        if: always() && env.QUALIFY_DIR != ''
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          folder = Path(os.environ['QUALIFY_DIR'])
          fixture = folder / 'fixture.env'
          reports = folder / 'reports'
          sanitized = folder / 'sanitized-reports'
          if fixture.is_symlink() or not fixture.is_file() or reports.is_symlink() or not reports.is_dir():
              raise RuntimeError('Missing or unexpected qualification fixture/report paths')
          values = dict(line.split('=', 1) for line in fixture.read_text(encoding='utf8').splitlines() if '=' in line)
          private = [values[key].encode() for key in ('POSTGRES_PASSWORD', 'POSTGRES_APP_PASSWORD') if values.get(key)]
          if len(private) != 2:
              raise RuntimeError('Missing generated fixture secrets')
          sanitized.mkdir(mode=0o700)
          entries = list(reports.iterdir())
          if len(entries) > 64:
              raise RuntimeError('Too many qualification report entries')
          total = 0
          for path in entries:
              if path.is_symlink() or not path.is_file() or path.suffix not in {'.json', '.log'}:
                  raise RuntimeError('Unexpected qualification report entry')
              if path.stat().st_size > 4_000_000:
                  raise RuntimeError('Qualification report exceeds export budget')
              data = path.read_bytes()
              total += len(data)
              if len(data) > 4_000_000 or total > 16_000_000:
                  raise RuntimeError('Qualification reports exceed export budget')
              for value in private:
                  data = data.replace(value, b'[redacted-generated-fixture]')
              (sanitized / path.name).write_bytes(data)
          PY
      - name: Retain sanitized qualification receipts
        if: always() && steps.sanitize_reports.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shipped-profile-qualification
          path: ${{ env.QUALIFY_DIR }}/sanitized-reports/
          if-no-files-found: warn
          retention-days: 14
      - name: Remove only this job's isolated profile and volumes
        if: always()
        run: |
          if [[ "$COMPOSE_PROJECT_NAME" =~ ^cmonitor-ci-[0-9]+-[0-9]+$ ]] && [[ -n "${QUALIFY_DIR:-}" ]] && [[ -f "$QUALIFY_DIR/fixture.env" ]]; then
            docker compose --env-file "$QUALIFY_DIR/fixture.env" -f docker-compose.yml -f "$QUALIFY_DIR/compose.override.yml" down --volumes --remove-orphans
          fi

  release_package:
    name: Admit exact source and package qualified prerelease
    needs: [frontend, backend, container_profile]
    if: github.event_name == 'push' && github.repository == 'DankWoodsmoke/conflict-monitor-public' && github.ref == 'refs/heads/codex/public-release' && github.actor == 'DankWoodsmoke'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      archive_sha256: ${{ steps.package.outputs.archive_sha256 }}
      verification_sha256: ${{ steps.package.outputs.verification_sha256 }}
      tag: ${{ steps.package.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Fail closed until the exact final local evidence is ready
        id: package
        run: python tools/prepare_release_publication.py --output "$RUNNER_TEMP/qualified-release"
      - name: Retain only the admitted release assets
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualified-release-${{ github.sha }}
          path: ${{ runner.temp }}/qualified-release/
          if-no-files-found: error
          retention-days: 7
  publish_qualified_prerelease:
    name: Publish and download-verify the qualified prerelease
    needs: [frontend, backend, container_profile, release_package]
    if: github.event_name == 'push' && github.repository == 'DankWoodsmoke/conflict-monitor-public' && github.ref == 'refs/heads/codex/public-release' && github.actor == 'DankWoodsmoke'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: conflict-monitor-public-prerelease
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      # No checkout, package install, cache or downloaded executable in this job.
      - name: Validate exact same-run artifact handoff before any download
        env:
          EXPECTED_ARTIFACT_ID: ${{ needs.release_package.outputs.artifact_id }}
          EXPECTED_ARCHIVE_SHA256: ${{ needs.release_package.outputs.archive_sha256 }}
          EXPECTED_VERIFICATION_SHA256: ${{ needs.release_package.outputs.verification_sha256 }}
        run: |
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r'[1-9][0-9]{0,19}', os.environ['EXPECTED_ARTIFACT_ID']), 'Exact artifact ID required; never download all artifacts'
          assert all(re.fullmatch(r'[a-f0-9]{64}', os.environ[key]) for key in ['EXPECTED_ARCHIVE_SHA256', 'EXPECTED_VERIFICATION_SHA256']), 'Exact asset handoff digests required'
          PY
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.release_package.outputs.artifact_id }}
          path: ${{ runner.temp }}/qualified-release
          merge-multiple: true
          digest-mismatch: error
      - name: Validate the exact data assets, refuse existing release/tag, publish and verify downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ASSET_DIR: ${{ runner.temp }}/qualified-release
          PUBLISHER_RECEIPT: ${{ runner.temp }}/publication-receipt.json
          EXPECTED_ARCHIVE_SHA256: ${{ needs.release_package.outputs.archive_sha256 }}
          EXPECTED_VERIFICATION_SHA256: ${{ needs.release_package.outputs.verification_sha256 }}
          EXPECTED_TAG: ${{ needs.release_package.outputs.tag }}
        shell: bash
        run: |
          python3 - <<'PY'
          """DRAFT source for an INLINE workflow step. Never execute downloaded code."""
          from hashlib import sha256
          import json
          import math
          import os
          from pathlib import Path, PurePosixPath
          import re
          import stat
          import subprocess
          import tempfile
          from datetime import datetime,timezone
          import urllib.error
          import urllib.request
          import zipfile
          
          
          # BEGIN REVIEWED PURE POLICY
          REPOSITORY='DankWoodsmoke/conflict-monitor-public'
          BRANCH='refs/heads/codex/public-release'
          VERSION='0.2.0-rc.5'
          READY='docs/qualification/RELEASE_READY.json'
          MANIFEST='docs/qualification/RELEASE_SOURCE_MANIFEST.json'
          ROLES={'backend','database','operator','public','tunnel'}
          GATES={'security','full_pipeline_soak','google_operator','google_public','media_replay','backup_restore'}
          RUNTIME_PREFIXES=('backend/','frontend/','tools/postgis/','tools/hosting/')
          RUNTIME_FILES={'docker-compose.yml','compose.public.yml','compose.publisher.yml','compose.tunnel.yml'}
          
          
          def canonical(value):return (json.dumps(value,sort_keys=True,separators=(',',':'),ensure_ascii=False,allow_nan=False)+'\n').encode()
          def checksum(value):return sha256(value).hexdigest()
          def valid_sha(value):return isinstance(value,str) and re.fullmatch(r'[0-9a-f]{64}',value) is not None
          def strict_json(data):
              def constant(_):raise ValueError('Non-finite JSON number refused')
              def pairs(items):
                  value={}
                  for key,item in items:
                      if key in value:raise ValueError('Duplicate JSON field refused')
                      value[key]=item
                  return value
              return json.loads(data,parse_constant=constant,object_pairs_hook=pairs)
          def finite_number(value,minimum):return type(value) in {int,float} and math.isfinite(value) and value>=minimum
          def exact_int(value,minimum=0):return type(value) is int and value>=minimum
          
          
          def identity(event,ref,repository,commit,actor):
              if event!='push' or ref!=BRANCH or repository!=REPOSITORY or actor!='DankWoodsmoke':raise ValueError('Untrusted release trigger')
              if not re.fullmatch(r'[0-9a-f]{40}',commit):raise ValueError('Exact commit required')
          
          
          def file_rows(snapshots):
              rows=[]
              for name,data in sorted(snapshots.items()):
                  path=PurePosixPath(name)
                  if path.is_absolute() or '..' in path.parts or '\\' in name or str(path)!=name:raise ValueError('Unsafe archive path')
                  if name not in {READY,MANIFEST}:rows.append({'path':name,'bytes':len(data),'sha256':checksum(data)})
              return rows
          
          
          # BEGIN REVIEWED ADMISSION POLICY
          """Private draft, stdlib-only release admission policy. No I/O or publication.
          
          Hashes bind retained evidence; they do not independently prove a human review.
          The private projector checks those bytes before creating the sanitized record.
          """
          from collections import Counter
          from datetime import datetime, timezone
          from hashlib import sha256
          import json
          import math
          import re
          
          ap_IMAGE_ROLES = {'backend', 'database', 'operator', 'public', 'tunnel'}
          ap_SERVICES = {'writer': 'backend', 'reader': 'backend', 'operator': 'operator', 'public': 'public', 'database': 'database'}
          ap_OBSERVERS = {'server', 'publication', 'delivery', 'operator-google', 'public-google'}
          ap_SCANS = {**{'image-' + r: r for r in ap_IMAGE_ROLES}, 'native-ffmpeg': 'backend', 'native-curl': 'backend', 'native-database': 'database'}
          ap_SEVERITIES = {'Critical': 4, 'High': 3, 'Medium': 2, 'Low': 1, 'Negligible': 0, 'Unknown': 5}
          
          
          def ap_require(condition, message):
              if not condition:
                  raise ValueError(message)
          
          
          def ap_strict_json(raw):
              def pairs(items):
                  result = {}
                  for key, value in items:
                      ap_require(key not in result, 'Duplicate JSON key')
                      result[key] = value
                  return result
              def constant(value):
                  raise ValueError('Nonfinite JSON constant: ' + value)
              return json.loads(raw, object_pairs_hook=pairs, parse_constant=constant)
          
          
          def ap_canonical(value):
              return (json.dumps(value, sort_keys=True, separators=(',', ':'), ensure_ascii=False, allow_nan=False) + '\n').encode()
          
          
          def ap_digest(value):
              return sha256(value).hexdigest()
          
          
          def ap_keys(value, expected, name):
              ap_require(type(value) is dict and set(value) == set(expected.split()), name + ' fields differ')
          
          
          def ap_number(value, minimum=0, maximum=1e12):
              ap_require(type(value) in {int, float} and math.isfinite(value) and minimum <= value <= maximum, 'Finite bounded number required')
          
          
          def ap_integer(value, minimum=0, maximum=1_000_000):
              ap_require(type(value) is int and minimum <= value <= maximum, 'Bounded integer required')
          
          
          def ap_hash_value(value):
              ap_require(type(value) is str and re.fullmatch('[a-f0-9]{64}', value) is not None, 'SHA256 required')
          
          
          def ap_hashes(value, minimum=1):
              ap_require(type(value) is list and minimum <= len(value) <= 2000 and len(set(value)) == len(value), 'Unique bounded evidence hashes required')
              for item in value:
                  ap_hash_value(item)
          
          
          def ap_clock(value):
              ap_require(type(value) is str and len(value) <= 40, 'UTC clock required')
              try:
                  result = datetime.fromisoformat(value.replace('Z', '+00:00'))
              except ValueError as error:
                  raise ValueError('Invalid clock') from error
              ap_require(result.tzinfo is not None and result.utcoffset().total_seconds() == 0, 'UTC clock required')
              return result
          
          
          def ap_images(value):
              ap_require(type(value) is dict and set(value) == ap_IMAGE_ROLES, 'Five candidate artifact roles required')
              ap_require(all(type(v) is str and re.fullmatch('sha256:[a-f0-9]{64}', v) for v in value.values()), 'Immutable image IDs required')
          
          
          def ap_common(proof):
              ap_require(type(proof) is dict and proof.get('status') == 'PASS', 'Final proof is not admitted')
              ap_images(proof.get('qualified_images'))
              ap_hash_value(proof.get('runtime_source_sha256'))
              ap_hash_value(proof.get('source_receipt_sha256'))
              ap_require(proof.get('execution') in {'fresh', 'rebound'}, 'Execution provenance required')
              if proof['execution'] == 'rebound':
                  ap_hash_value(proof.get('equivalence_sha256'))
          
          
          def ap_validate_security(proof):
              ap_common(proof)
              ap_keys(proof, 'status execution source_receipt_sha256 runtime_source_sha256 qualified_images security' + (' equivalence_sha256' if proof['execution'] == 'rebound' else ''), 'security proof')
              ap_require('raw_high_critical_gate' not in proof, 'Raw findings must not be relabeled PASS')
              s = proof.get('security')
              ap_keys(s, 'schema admission reviewed_at candidate_receipt_sha256 matrix_sha256 validation_sha256 independent_review_sha256 verified_evidence_sha256s reference_verification scans dispositions residuals non_cve_issues final_refresh', 'security')
              ap_require(s['schema'] == 1 and type(s['schema']) is int, 'Security schema mismatch')
              ap_require(s['admission'] == 'SCOPED_COMPONENT_REVIEW_WITH_RESIDUALS', 'Explicit scoped admission required')
              reviewed_at = ap_clock(s['reviewed_at'])
              for key in ('candidate_receipt_sha256', 'matrix_sha256', 'validation_sha256', 'independent_review_sha256'):
                  ap_hash_value(s[key])
              ap_require(s['independent_review_sha256'] == proof['source_receipt_sha256'], 'Independent review binding differs')
              ap_hashes(s['verified_evidence_sha256s'])
              evidence = set(s['verified_evidence_sha256s'])
              references = s['reference_verification']
              ap_keys(references, 'status receipt_sha256 verified_sha256s', 'independent reference verification')
              ap_require(references['status'] == 'INDEPENDENT_REFERENCE_BYTES_VERIFIED', 'Reference bytes lack independent review')
              ap_hash_value(references['receipt_sha256'])
              ap_hashes(references['verified_sha256s'])
              checked_references = set(references['verified_sha256s'])
              ap_require(evidence <= checked_references, 'Original reviewed evidence omitted from reference verification')
              ap_require({s[k] for k in ('candidate_receipt_sha256', 'matrix_sha256', 'validation_sha256', 'independent_review_sha256')} <= checked_references, 'Unverified candidate/matrix/validation/review reference')
              ap_require(type(s['scans']) is dict and set(s['scans']) == set(ap_SCANS), 'Complete image and native scan inventory required')
              records = {}
              for scan_id, scan in s['scans'].items():
                  ap_keys(scan, 'role image raw_sha256 receipt_sha256 execution equivalence_sha256 inventory_sha256 exit_code database_sha256 database_built record_count severity_counts records', 'scan')
                  ap_require(scan['role'] == ap_SCANS[scan_id] and scan['image'] == proof['qualified_images'][scan['role']], 'Scan image binding differs')
                  for key in ('raw_sha256', 'receipt_sha256', 'database_sha256'):
                      ap_hash_value(scan[key])
                  ap_require({scan['raw_sha256'], scan['receipt_sha256']} <= checked_references, 'Unverified raw scan or receipt reference')
                  ap_clock(scan['database_built'])
                  ap_require(scan['execution'] in {'fresh', 'rebound'}, 'Scan execution provenance required')
                  if scan['execution'] == 'rebound':
                      ap_hash_value(scan['equivalence_sha256'])
                      ap_require(scan['equivalence_sha256'] in checked_references, 'Unverified scan equivalence reference')
                  else:
                      ap_require(scan['equivalence_sha256'] is None, 'Fresh scan must not claim a rebind')
                  if scan_id.startswith('native-'):
                      ap_hash_value(scan['inventory_sha256'])
                      ap_require(scan['inventory_sha256'] in checked_references, 'Unverified native inventory reference')
                  else:
                      ap_require(scan['inventory_sha256'] is None, 'Image scan inventory is its exact image')
                  ap_integer(scan['record_count'])
                  ap_require(type(scan['records']) is list and len(scan['records']) == scan['record_count'], 'Scan record count differs')
                  counts = Counter()
                  for row in scan['records']:
                      ap_keys(row, 'key vulnerability severity package version namespace match_sha256', 'raw match')
                      for field in ('vulnerability', 'package', 'version', 'namespace'):
                          ap_require(type(row[field]) is str and 0 < len(row[field]) <= 300, 'Bounded match identity required')
                      ap_require(row['severity'] in ap_SEVERITIES, 'Unknown severity label')
                      ap_hash_value(row['match_sha256'])
                      identity = {k: v for k, v in row.items() if k != 'key'}
                      ap_require(row['key'] == ap_digest(ap_canonical(identity)), 'Normalized record digest differs')
                      key = scan_id + ':' + row['key']
                      ap_require(key not in records, 'Duplicate raw match')
                      records[key] = (scan['role'], row)
                      counts[row['severity']] += 1
                  ap_require(type(scan['severity_counts']) is dict, 'Severity counts must be an object')
                  for value in scan['severity_counts'].values():
                      ap_integer(value, 1)
                  ap_require(scan['severity_counts'] == dict(counts), 'Raw severity counts changed')
                  ap_integer(scan['exit_code'], 0, 2)
                  expected_exit = 2 if counts['High'] or counts['Critical'] else 0
                  ap_require(scan['exit_code'] == expected_exit, 'Recorded fail-on-high scanner exit inconsistent')
              ap_require(type(s['dispositions']) is list and 1 <= len(s['dispositions']) <= 1000, 'Reviewed dispositions required')
              covered, pairs, residuals = set(), set(), []
              for row in s['dispositions']:
                  ap_keys(row, 'role vulnerability severity disposition reason limits image evidence_sha256s image_binding_sha256s record_keys source_row_sha256 review_row_sha256', 'disposition')
                  pair = (row['role'], row['vulnerability'])
                  ap_require(row['role'] in ap_IMAGE_ROLES and pair not in pairs, 'Duplicate/invalid disposition role')
                  pairs.add(pair)
                  ap_require(row['image'] == proof['qualified_images'][row['role']], 'Disposition image differs')
                  ap_require(row['severity'] in ap_SEVERITIES, 'Disposition severity invalid')
                  ap_require(row['disposition'] in {'fixed', 'vulnerable_code_absent', 'affected_unresolved'}, 'Unreviewed status cannot admit')
                  for field in ('reason', 'limits'):
                      ap_require(type(row[field]) is str and 1 <= len(row[field]) <= 5000, 'Review rationale and scope required')
                  for field in ('evidence_sha256s', 'image_binding_sha256s'):
                      ap_hashes(row[field])
                      ap_require(set(row[field]) <= evidence, 'Evidence hash was not independently checked')
                  ap_hash_value(row['source_row_sha256']); ap_hash_value(row['review_row_sha256'])
                  ap_require(type(row['record_keys']) is list and len(row['record_keys']) == len(set(row['record_keys'])), 'Duplicate row mapping')
                  for key in row['record_keys']:
                      ap_require(key in records and key not in covered, 'Missing/duplicate raw disposition')
                      role, match = records[key]
                      ap_require((role, match['vulnerability']) == pair, 'Wrong finding assigned to disposition')
                      ap_require(ap_SEVERITIES[row['severity']] >= ap_SEVERITIES[match['severity']], 'Severity was lowered')
                      covered.add(key)
                  if row['disposition'] == 'affected_unresolved':
                      ap_require(row['severity'] in {'Medium', 'Low', 'Negligible'}, 'Unresolved High/Critical/Unknown blocks release')
                      residuals.append({'role': row['role'], 'vulnerability': row['vulnerability'], 'severity': row['severity']})
              ap_require(covered == set(records), 'Raw or supplemental finding omitted')
              ap_require(s['residuals'] == sorted(residuals, key=lambda x: (x['role'], x['vulnerability'])), 'Residual findings omitted or altered')
              ap_require(type(s['non_cve_issues']) is list and len(s['non_cve_issues']) <= 100, 'Non-CVE scope inventory required')
              for row in s['non_cve_issues']:
                  ap_keys(row, 'role issue disposition source_disposition limits evidence_sha256s', 'non-CVE issue')
                  ap_require(row['role'] in ap_IMAGE_ROLES, 'Invalid non-CVE role')
                  ap_require(row['disposition'] in {'fixed', 'reviewed_scope_limit'}, 'Pending non-CVE review blocks admission')
                  for field in ('issue', 'source_disposition', 'limits'):
                      ap_require(type(row[field]) is str and 1 <= len(row[field]) <= 3000, 'Non-CVE scope missing')
                  ap_hashes(row['evidence_sha256s'])
                  ap_require(set(row['evidence_sha256s']) <= evidence, 'Non-CVE evidence is unbound')
              refresh = s['final_refresh']
              ap_keys(refresh, 'status completed_at official_database_sha256 upstream_review_sha256 receipt_sha256', 'final refresh')
              ap_require(refresh['status'] == 'COMPLETE_NO_UNRESOLVED_HIGH_CRITICAL', 'Final advisory review incomplete')
              completed = ap_clock(refresh['completed_at'])
              ap_require(completed >= reviewed_at, 'Final refresh predates component review')
              for field in ('official_database_sha256', 'upstream_review_sha256', 'receipt_sha256'):
                  ap_hash_value(refresh[field])
              ap_require({refresh['upstream_review_sha256'], refresh['receipt_sha256']} <= checked_references, 'Final refresh/upstream review bytes are unverified')
              ap_require(all(scan['database_sha256'] == refresh['official_database_sha256'] for scan in s['scans'].values()), 'Scans do not use the final official advisory database')
              return s
          
          
          def ap_cadence(elapsed, clocks):
              ap_number(elapsed, 0, 15000)
              ap_require(type(clocks) is list and len(clocks) >= 2, 'Sample clocks missing')
              for item in clocks:
                  ap_number(item, 0, elapsed)
              ap_require(all(b > a for a, b in zip(clocks, clocks[1:])), 'Sample clocks not strictly increasing')
              result = {'first_seconds': clocks[0], 'maximum_gap_seconds': max(b-a for a, b in zip(clocks, clocks[1:])), 'final_gap_seconds': elapsed-clocks[-1]}
              ap_require(all(0 <= x <= 90 for x in result.values()), 'Initial, interior or final sample gap exceeds90s')
              return result
          
          
          ap_SERVER_CHECKS = {'observer_finished', 'requested_duration_observed', 'sample_cadence_bounded', 'rest_requests_successful', 'sampled_integrity_preserved', 'sql_checks_available', 'sql_integrity_preserved', 'websocket_connected', 'websocket_available_over_95_percent', 'websocket_payloads_valid', 'one_backend_and_frontend_image_pair', 'no_recorded_paid_usage', 'explicitly_disabled_telegram_transport', 'no_new_telegram_event_ids'}
          ap_SERVER_CHECKS |= {'database_identity_observed_throughout', 'one_three_container_start_and_database_volume_identity', 'database_versions_and_collation_observed', 'expected_postgresql_version', 'expected_postgis_version', 'expected_database_volume', 'expected_database_name_and_role'}
          ap_BROWSER_CHECKS = {'all_tabs_seen', 'one_persistent_canvas', 'google_ready_all_samples', 'identities_stable', 'source_hashes_match', 'no_page_errors', 'no_generation_requests'}
          
          
          def ap_validate_soak(proof):
              ap_common(proof)
              ap_keys(proof, 'status execution source_receipt_sha256 runtime_source_sha256 qualified_images soak', 'soak proof')
              ap_require(proof['execution'] == 'fresh', 'Full soak must be a fresh exact-profile execution')
              s = proof.get('soak')
              ap_keys(s, 'schema launch_sha256 candidate_receipt_sha256 started_at ended_at rehearsal_only observer_sources_unchanged private_runners_unchanged observer_source_hashes private_runner_hashes observed_services unobserved_image_roles observers', 'soak')
              ap_require(type(s['schema']) is int and s['schema'] == 1, 'Soak schema mismatch')
              ap_hash_value(s['launch_sha256']); ap_hash_value(s['candidate_receipt_sha256'])
              ap_require(s['launch_sha256'] == proof['source_receipt_sha256'], 'Launch binding differs')
              start, end = ap_clock(s['started_at']), ap_clock(s['ended_at'])
              ap_number((end-start).total_seconds(), 14400, 14760)
              ap_require(s['rehearsal_only'] is False and s['observer_sources_unchanged'] is True and s['private_runners_unchanged'] is True, 'Rehearsal or changed observer source cannot qualify')
              ap_hashes(s['observer_source_hashes']); ap_hashes(s['private_runner_hashes'])
              ap_require(type(s['observed_services']) is dict and set(s['observed_services']) == set(ap_SERVICES), 'Five observed service roles required')
              for service, binding in s['observed_services'].items():
                  ap_keys(binding, 'image started_at identity_sha256', 'service')
                  ap_require(binding['image'] == proof['qualified_images'][ap_SERVICES[service]], 'Observed service uses wrong candidate image')
                  ap_require(ap_clock(binding['started_at']) <= start, 'Service started during observation')
                  ap_hash_value(binding['identity_sha256'])
              ap_require(len({row['identity_sha256'] for row in s['observed_services'].values()}) == 5, 'Five distinct service identities required')
              ap_require(s['unobserved_image_roles'] == ['tunnel'], 'Offline connector must not be represented as observed')
              ap_require(type(s['observers']) is dict and set(s['observers']) == ap_OBSERVERS, 'All five observers required')
              for name, row in s['observers'].items():
                  ap_keys(row, 'status exit_code summary_sha256 samples_sha256 requested_seconds elapsed_seconds samples cadence checks metrics', 'observer')
                  ap_require(row['status'] == ('completed_sample' if name.endswith('-google') else 'qualified_sample'), 'Observer did not qualify')
                  ap_require(type(row['exit_code']) is int and row['exit_code'] == 0, 'Observer exit failed')
                  ap_hash_value(row['summary_sha256']); ap_hash_value(row['samples_sha256'])
                  ap_integer(row['requested_seconds'], 14400, 14400)
                  ap_number(row['elapsed_seconds'], 14400, 14600)
                  ap_integer(row['samples'], 479, 600)
                  ap_keys(row['cadence'], 'first_seconds maximum_gap_seconds final_gap_seconds', 'cadence')
                  for value in row['cadence'].values():
                      ap_number(value, 0, 90)
                  checks, metrics = row['checks'], row['metrics']
                  ap_require(type(checks) is dict and checks and all(v is True for v in checks.values()), 'Observer assertion failed or missing')
                  if name == 'server':
                      ap_require(ap_SERVER_CHECKS <= set(checks), 'Missing independent server requirements')
                      ap_keys(metrics, 'sql_checks unavailable_sql_checks websocket_connected_fraction', 'server metrics')
                      ap_integer(metrics['sql_checks'], 2); ap_integer(metrics['unavailable_sql_checks'], 0, 0)
                      ap_number(metrics['websocket_connected_fraction'], .95, 1)
                  elif name == 'publication':
                      ap_require(set(checks) == {'identities_stable', 'no_findings', 'exact_download_sql_display_projection', 'resource_sampling_complete'}, 'Publication assertions differ')
                      ap_keys(metrics, 'observations aircraft', 'publication metrics')
                      for dataset in metrics.values():
                          ap_keys(dataset, 'samples distinct_batches maximum_rows', 'dataset')
                          ap_integer(dataset['samples'], 479, 600)
                          ap_require(dataset['samples'] == row['samples'], 'Dataset samples incomplete')
                          ap_integer(dataset['distinct_batches'], 2); ap_integer(dataset['maximum_rows'], 1, 10000)
                  elif name == 'delivery':
                      ap_require(set(checks) == {'identities_stable', 'no_findings', 'cadence_sufficient'}, 'Delivery assertions differ')
                      ap_keys(metrics, 'upserts verified_offsets pages', 'delivery metrics')
                      for value in metrics.values():
                          ap_integer(value, 1)
                  else:
                      required = ap_BROWSER_CHECKS | ({'public_http_scene_agreement', 'public_response_success'} if name == 'public-google' else set())
                      ap_require(set(checks) == required, 'Browser assertions differ')
                      ap_keys(metrics, 'scope roots_requested roots_succeeded natural_rotation_after_first_root_seconds child_successes_after_three_hours child_requests_after_three_hours post_three_hour_camera_action public_observations_max public_aircraft_max', 'Google metrics')
                      ap_require(metrics['scope'] == 'genuine_google_long_session_stable_profile', 'Browser was not in genuine stable long-session mode')
                      ap_integer(metrics['roots_requested'], 2, 20); ap_integer(metrics['roots_succeeded'], 2, 20)
                      ap_require(metrics['roots_succeeded'] == metrics['roots_requested'], 'Google root request/response coverage differs')
                      ap_number(metrics['natural_rotation_after_first_root_seconds'], 8998, row['elapsed_seconds'])
                      ap_integer(metrics['child_successes_after_three_hours'], 1); ap_integer(metrics['child_requests_after_three_hours'], metrics['child_successes_after_three_hours'])
                      ap_require(metrics['post_three_hour_camera_action'] is True, 'No post-three-hour exploration')
                      for field in ('public_observations_max', 'public_aircraft_max'):
                          ap_integer(metrics[field], 1 if name == 'public-google' else 0, 10000)
              return s
          
          
          def ap_validate_pair(security_proof, soak_proof):
              security, soak = ap_validate_security(security_proof), ap_validate_soak(soak_proof)
              ap_require(security_proof['qualified_images'] == soak_proof['qualified_images'] and security_proof['runtime_source_sha256'] == soak_proof['runtime_source_sha256'], 'Security/soak artifact binding differs')
              ap_require(security['candidate_receipt_sha256'] == soak['candidate_receipt_sha256'], 'Candidate receipts differ')
              ap_require(ap_clock(security['final_refresh']['completed_at']) >= ap_clock(soak['ended_at']), 'Final advisory review must follow the full soak')
              return True
          # END REVIEWED ADMISSION POLICY
          
          
          def qualify(snapshots,version):
              if READY not in snapshots or MANIFEST not in snapshots:raise ValueError('Final local qualification is absent')
              ready=strict_json(snapshots[READY]);declared=strict_json(snapshots[MANIFEST])
              if type(ready) is not dict or type(ready.get('schema')) is not int or ready.get('schema')!=1 or ready.get('ready') is not True or ready.get('prerelease') is not True:raise ValueError('Final local qualification is not ready')
              if ready.get('repository')!=REPOSITORY or ready.get('release_ref')!=BRANCH or ready.get('version')!=version or version!=VERSION:raise ValueError('Release identity differs')
              if set(ready)!={'schema','ready','prerelease','repository','release_ref','version','source_manifest_sha256','runtime_source_sha256','images','evidence','limitations'}:raise ValueError('Unexpected readiness fields')
              rows=file_rows(snapshots)
              if type(declared) is not dict or set(declared)!={'schema','files'} or type(declared['schema']) is not int or declared['schema']!=1 or type(declared['files']) is not list:raise ValueError('Source manifest schema differs')
              for row in declared['files']:
                  if type(row) is not dict or set(row)!={'path','bytes','sha256'} or type(row['path']) is not str or not exact_int(row['bytes']) or not valid_sha(row['sha256']):raise ValueError('Source inventory field types differ')
              if declared!={'schema':1,'files':rows}:raise ValueError('Source inventory differs, including additions or omissions')
              if ready.get('source_manifest_sha256')!=checksum(snapshots[MANIFEST]):raise ValueError('Source manifest digest differs')
              runtime=[r for r in rows if r['path'].startswith(RUNTIME_PREFIXES) or r['path'] in RUNTIME_FILES]
              if not RUNTIME_FILES<={r['path'] for r in runtime}:raise ValueError('Runtime profile inventory incomplete')
              runtime_hash=checksum(canonical(runtime))
              if ready.get('runtime_source_sha256')!=runtime_hash:raise ValueError('Qualified runtime source differs')
              images=ready.get('images',{})
              if type(images) is not dict or set(images)!=ROLES or not all(type(v) is str and re.fullmatch(r'sha256:[0-9a-f]{64}',v) for v in images.values()):raise ValueError('Five immutable runtime image identities required')
              proofs=ready.get('evidence',{})
              if set(proofs)!=GATES:raise ValueError('Required evidence inventory incomplete')
              admitted_proofs={}
              for name,reference in proofs.items():
                  if type(reference) is not dict or set(reference)!={'path','sha256'}:raise ValueError('Evidence reference schema differs')
                  path=reference.get('path','')
                  if not re.fullmatch(r'docs/qualification/[A-Za-z0-9_.-]+\.json',path) or path in {READY,MANIFEST} or path not in snapshots:raise ValueError('Evidence must be a committed sanitized projection')
                  if reference.get('sha256')!=checksum(snapshots[path]):raise ValueError('Evidence digest differs')
                  proof=strict_json(snapshots[path])
                  if type(proof) is not dict:raise ValueError('Evidence must be an object')
                  accepted={'PASS','QUALIFIED_WITH_LIMITATIONS'} if name=='media_replay' else {'PASS'}
                  if proof.get('status') not in accepted or proof.get('runtime_source_sha256')!=runtime_hash or proof.get('qualified_images')!=images:raise ValueError('Evidence outcome or source/image identity differs')
                  if not valid_sha(proof.get('source_receipt_sha256')) or proof.get('execution') not in {'fresh','rebound'}:raise ValueError('Original execution evidence required')
                  if proof['execution']=='rebound' and not valid_sha(proof.get('equivalence_sha256')):raise ValueError('Historical evidence requires explicit equivalence proof')
                  admitted_proofs[name]=proof
                  if name=='full_pipeline_soak':ap_validate_soak(proof)
                  if name=='security':ap_validate_security(proof)
                  if name=='media_replay' and (type(proof.get('qualified_engines')) is not int or proof['qualified_engines']!=3 or type(proof.get('implicit_generation_requests')) is not int or proof['implicit_generation_requests']!=0):raise ValueError('Native replay UI gate incomplete')
              ap_validate_pair(admitted_proofs['security'],admitted_proofs['full_pipeline_soak'])
              limits=ready.get('limitations')
              if not isinstance(limits,list) or not 1<=len(limits)<=20 or any(not isinstance(x,str) or not 1<=len(x)<=600 or '\n' in x for x in limits):raise ValueError('Bounded explicit release limitations required')
              return ready
          
          
          def ci_identity(run_id,attempt):
              if not re.fullmatch(r'[1-9][0-9]{0,19}',str(run_id)) or not re.fullmatch(r'[1-9][0-9]{0,4}',str(attempt)):raise ValueError('Exact hosted run identity required')
              return {'run_id':str(run_id),'run_attempt':str(attempt),'url':'https://github.com/'+REPOSITORY+'/actions/runs/'+str(run_id)}
          # END REVIEWED PURE POLICY
          
          def digest(data):return sha256(data).hexdigest()
          
          
          def validate(folder,env):
              if env['GITHUB_EVENT_NAME']!='push' or env['GITHUB_REF']!='refs/heads/codex/public-release' or env['GITHUB_REPOSITORY']!='DankWoodsmoke/conflict-monitor-public' or env['GITHUB_ACTOR']!='DankWoodsmoke':raise ValueError('Untrusted publisher trigger')
              commit=env['GITHUB_SHA']
              if not re.fullmatch(r'[0-9a-f]{40}',commit):raise ValueError('Invalid source commit')
              items=list(folder.iterdir())
              if len(items)!=4 or any(p.is_symlink() or not p.is_file() for p in items):raise ValueError('Unexpected artifact entry')
              raw=(folder/'verification.json').read_bytes()
              if len(raw)>100_000 or digest(raw)!=env['EXPECTED_VERIFICATION_SHA256']:raise ValueError('Verification asset digest differs')
              verification=strict_json(raw);tag=verification.get('tag','')
              if not re.fullmatch(r'v\d+\.\d+\.\d+-rc\.\d+',tag) or tag!=env['EXPECTED_TAG']:raise ValueError('Tag identity differs')
              if verification.get('status')!='READY_FOR_PRERELEASE' or verification.get('source_commit')!=commit or verification.get('repository')!=env['GITHUB_REPOSITORY'] or verification.get('release_ref')!=env['GITHUB_REF']:raise ValueError('Publication identity differs')
              run_id,attempt=env['GITHUB_RUN_ID'],env['GITHUB_RUN_ATTEMPT']
              if not re.fullmatch(r'[1-9][0-9]{0,19}',run_id) or not re.fullmatch(r'[1-9][0-9]{0,4}',attempt):raise ValueError('Invalid hosted run identity')
              if verification.get('ci')!={'run_id':run_id,'run_attempt':attempt,'url':'https://github.com/'+env['GITHUB_REPOSITORY']+'/actions/runs/'+run_id}:raise ValueError('Same-run hosted verification identity differs')
              filename='conflict-monitor-'+tag[1:]+'-source.zip'
              if {p.name for p in items}!={filename,filename+'.sha256','verification.json','RELEASE_NOTES.txt'}:raise ValueError('Unexpected asset names')
              package=folder/filename
              if package.stat().st_size>128*1024**2:raise ValueError('Archive exceeds budget')
              data=package.read_bytes()
              if digest(data)!=env['EXPECTED_ARCHIVE_SHA256'] or verification.get('archive')!={'name':filename,'bytes':len(data),'sha256':digest(data)}:raise ValueError('Archive handoff digest differs')
              if (folder/(filename+'.sha256')).read_bytes()!=(digest(data)+'  '+filename+'\n').encode():raise ValueError('Checksum asset differs')
              notes=(folder/'RELEASE_NOTES.txt').read_bytes()
              if not 1<=len(notes)<=16_000 or digest(notes)!=verification.get('release_notes_sha256'):raise ValueError('Release notes differ or exceed budget')
              with zipfile.ZipFile(package) as archive:
                  entries=archive.infolist();names=[e.filename for e in entries]
                  if not 1<=len(entries)<=2000 or len(set(names))!=len(names) or sum(e.file_size for e in entries)>512*1024**2:raise ValueError('Archive entry budget/uniqueness failed')
                  for item in entries:
                      name=PurePosixPath(item.filename)
                      if not item.filename.startswith('conflict-monitor/') or name.is_absolute() or '..' in name.parts or '\\' in item.filename or str(name)!=item.filename or item.file_size>32*1024**2 or stat.S_ISLNK(item.external_attr>>16):raise ValueError('Unsafe archive entry')
                      expected_mode=0o100755 if item.filename.endswith('.sh') else 0o100644
                      if item.external_attr>>16!=expected_mode or item.create_system!=3 or item.date_time!=(2020,1,1,0,0,0) or item.compress_type!=zipfile.ZIP_DEFLATED or item.flag_bits&1 or item.extra or item.comment:raise ValueError('Archive mode or deterministic metadata differs')
                  manifest=strict_json(archive.read('conflict-monitor/RELEASE_MANIFEST.json'))
                  if manifest.get('status')!='candidate' or manifest.get('version')!=tag[1:]:raise ValueError('Archive release identity differs')
                  expected={r['path'] for r in manifest['files']}
                  if len(expected)!=len(manifest['files']) or set(names)!={'conflict-monitor/'+n for n in expected}|{'conflict-monitor/RELEASE_MANIFEST.json'}:raise ValueError('Archive source inventory differs')
                  for row in manifest['files']:
                      if type(row) is not dict or set(row)!={'path','bytes','sha256'} or type(row['bytes']) is not int or row['bytes']<0 or not valid_sha(row['sha256']):raise ValueError('Archive inventory schema differs')
                      body=archive.read('conflict-monitor/'+row['path'])
                      if row!={'path':row['path'],'bytes':len(body),'sha256':digest(body)}:raise ValueError('Archive source bytes differ')
                  snapshots={row['path']:archive.read('conflict-monitor/'+row['path']) for row in manifest['files']}
                  ready=qualify(snapshots,tag[1:])
                  if digest(snapshots[READY])!=verification['ready_receipt_sha256']:raise ValueError('Ready receipt handoff differs')
                  for key in ['source_manifest_sha256','runtime_source_sha256','images','evidence','limitations']:
                      if ready[key]!=verification.get(key):raise ValueError('Qualification handoff differs')
              return verification
          
          
          def api(path,token,expected=200):
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self,*_):raise ValueError('GitHub API redirect refused')
              request=urllib.request.Request('https://api.github.com/'+path,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirect())
              try:
                  with opener.open(request,timeout=30) as response:status=response.status;raw=response.read(1024**2+1)
              except urllib.error.HTTPError as error:
                  status=error.code;raw=b''
              if status!=expected:raise ValueError('GitHub API state differs; HTTP '+str(status))
              if len(raw)>1024**2:raise ValueError('GitHub API response exceeds budget')
              return strict_json(raw) if raw else None
          
          
          def current_head(repo,token,commit):
              head=api(f'repos/{repo}/git/ref/heads/codex/public-release',token)
              if head.get('object',{}).get('sha')!=commit or head.get('object',{}).get('type')!='commit':raise ValueError('Trusted branch HEAD moved; refusing stale publication')
          
          
          def remote_download(folder,repo,tag,assets,env,observations,save):
              with tempfile.TemporaryDirectory(prefix='verified-release-download-') as temporary:
                  command=['gh','release','download',tag,'--repo',repo,'--dir',temporary]
                  for asset in assets:command+=['--pattern',asset.name]
                  result=subprocess.run(command,capture_output=True,env=env,timeout=180)
                  if result.returncode:raise ValueError('Independent release download failed')
                  actual=list(Path(temporary).iterdir())
                  if {p.name for p in actual}!={p.name for p in assets} or any(p.is_symlink() or not p.is_file() for p in actual):raise ValueError('Downloaded asset inventory differs')
                  for asset in assets:
                      local=asset.read_bytes();downloaded=Path(temporary)/asset.name
                      row={'name':asset.name,'expected_bytes':len(local),'downloaded_bytes':downloaded.stat().st_size,
                           'local_sha256':digest(local),'downloaded_sha256':None,'matches':False}
                      observations.append(row);save()
                      if row['downloaded_bytes']!=len(local):raise ValueError('Released download size differs')
                      downloaded_bytes=downloaded.read_bytes();row['downloaded_sha256']=digest(downloaded_bytes)
                      row['matches']=downloaded_bytes==local;save()
                      if not row['matches']:raise ValueError('Released download bytes differ')
          
          
          def publish(folder,env):
              report=Path(env['PUBLISHER_RECEIPT']).resolve()
              if report.parent!=folder.resolve().parent or report.name!='publication-receipt.json' or report.exists():raise ValueError('Fresh publisher receipt must be outside the admitted assets')
              receipt={'schema':1,'status':'RUNNING','stage':'admission','source_commit':env.get('GITHUB_SHA'),'ci_run_id':env.get('GITHUB_RUN_ID'),'stages':[],'remote_observations':[],
                       'scope':'Source prerelease publication only; no site deployment. Partial tag/draft state is never overwritten.'}
              def save():report.write_bytes(canonical(receipt))
              def stage(name):receipt['stage']=name;save()
              def done(name):receipt['stages'].append({'stage':name,'completed_at':datetime.now(timezone.utc).isoformat()});save()
              save()
              try:
                  value=validate(folder,env);repo=env['GITHUB_REPOSITORY'];tag=value['tag'];commit=env['GITHUB_SHA'];token=env['GH_TOKEN']
                  receipt.update(repository=repo,tag=tag,archive_sha256=value['archive']['sha256'],verification_sha256=env['EXPECTED_VERIFICATION_SHA256']);done('admission')
                  stage('absence_and_head')
                  api(f'repos/{repo}/git/ref/tags/{tag}',token,404)
                  api(f'repos/{repo}/releases/tags/{tag}',token,404)
                  current_head(repo,token,commit);done('absence_and_head')
                  stage('create_exact_tag')
                  result=subprocess.run(['gh','api','--method','POST',f'repos/{repo}/git/refs','--input','-'],input=json.dumps({'ref':'refs/tags/'+tag,'sha':commit}).encode(),capture_output=True,env=env,timeout=45)
                  if result.returncode:raise ValueError('Exact tag creation failed; no overwrite attempted')
                  created=strict_json(result.stdout)
                  if created['ref']!='refs/tags/'+tag or created['object']['type']!='commit' or created['object']['sha']!=commit:raise ValueError('Created tag differs')
                  receipt['created_tag']={'ref':created['ref'],'object_type':created['object']['type'],'commit':created['object']['sha']}
                  done('create_exact_tag')
                  assets=[folder/value['archive']['name'],folder/(value['archive']['name']+'.sha256'),folder/'verification.json']
                  stage('create_draft_prerelease')
                  command=['gh','release','create',tag,*map(str,assets),'--repo',repo,'--target',commit,'--verify-tag','--draft','--prerelease','--latest=false','--title','Conflict Monitor '+tag,'--notes-file',str(folder/'RELEASE_NOTES.txt')]
                  result=subprocess.run(command,capture_output=True,env=env,timeout=180)
                  if result.returncode:raise ValueError('Draft release creation incomplete; preserve partial state for review')
                  done('create_draft_prerelease')
                  def remote_state(draft,expected_assets,phase):
                      observed={'phase':phase,'observed_at':datetime.now(timezone.utc).isoformat(),'expected_draft':draft,
                                'expected_tag':tag,'expected_tag_commit':commit,'actual_tag_commit':None,'tag_matches':False,
                                'release_id':None,'draft':None,'prerelease':None,'assets':[],'downloads':[]}
                      receipt['remote_observations'].append(observed);save()
                      actual=api(f'repos/{repo}/git/ref/tags/{tag}',token)
                      target=actual.get('object',{});actual_commit=target.get('sha')
                      observed['actual_tag_commit']=actual_commit if type(actual_commit) is str and re.fullmatch('[a-f0-9]{40}',actual_commit) else None
                      observed['tag_matches']=target.get('type')=='commit' and actual_commit==commit;save()
                      if not observed['tag_matches']:raise ValueError('Remote tag differs from qualified commit')
                      release=api(f'repos/{repo}/releases/tags/{tag}',token)
                      observed.update(release_id=release.get('id') if type(release.get('id')) is int else None,
                                      draft=release.get('draft') if type(release.get('draft')) is bool else None,
                                      prerelease=release.get('prerelease') if type(release.get('prerelease')) is bool else None,
                                      release_tag_matches=release.get('tag_name')==tag)
                      save()
                      if type(release.get('id')) is not int or release['id']<=0 or receipt.get('release_id',release['id'])!=release['id']:raise ValueError('Remote release identity differs')
                      if release['draft'] is not draft or release['prerelease'] is not True or release['tag_name']!=tag:raise ValueError('Release visibility differs')
                      remote_assets=release.get('assets');expected={p.name:p for p in expected_assets}
                      if type(remote_assets) is not list or len(remote_assets)!=len(expected):raise ValueError('Release asset inventory differs')
                      if any(type(a) is not dict or type(a.get('name')) is not str for a in remote_assets) or {a['name'] for a in remote_assets}!=set(expected):raise ValueError('Release asset inventory differs')
                      seen=set()
                      for remote in remote_assets:
                          local=expected[remote['name']].read_bytes();wanted=digest(local);remote_digest=remote.get('digest')
                          valid_digest=remote_digest is None or type(remote_digest) is str and re.fullmatch('sha256:[a-f0-9]{64}',remote_digest) is not None
                          row={'name':remote['name'],'asset_id':remote.get('id') if type(remote.get('id')) is int else None,
                               'api_bytes':remote.get('size') if type(remote.get('size')) is int else None,
                               'expected_bytes':len(local),'local_sha256':wanted,'api_sha256':remote_digest[7:] if valid_digest and remote_digest is not None else None,
                               'api_digest_present':remote_digest is not None,'api_digest_valid':valid_digest,'uploaded':remote.get('state')=='uploaded'}
                          observed['assets'].append(row);save()
                          if row['asset_id'] is None or row['asset_id']<=0 or row['asset_id'] in seen:raise ValueError('Remote asset identity invalid')
                          seen.add(row['asset_id'])
                          if row['api_bytes']!=len(local) or not row['uploaded']:raise ValueError('Remote asset size or upload state differs')
                          if not valid_digest or remote_digest is not None and row['api_sha256']!=wanted:raise ValueError('Remote API asset digest differs')
                      return observed
                  stage('verify_draft_downloads')
                  observed=remote_state(True,assets,'draft_source_assets');receipt['release_id']=observed['release_id']
                  remote_download(folder,repo,tag,assets,env,observed['downloads'],save);done('verify_draft_downloads')
                  stage('retain_durable_draft_receipt')
                  durable_dir=folder.parent/'durable-publication-evidence';durable_dir.mkdir(mode=0o700)
                  durable=durable_dir/'publication-receipt.json'
                  # Upload before promotion so the flow also supports immutable releases.
                  # This frozen receipt never claims its own future upload or publication.
                  durable.write_bytes(canonical({**receipt,'status':'DRAFT_SOURCE_ASSETS_DOWNLOADED_VERIFIED','publication_not_yet_performed':True,
                      'scope':'Source assets verified while draft. Actual promotion and public download result are retained in the linked CI run.'}))
                  result=subprocess.run(['gh','release','upload',tag,str(durable),'--repo',repo],capture_output=True,env=env,timeout=90)
                  if result.returncode:raise ValueError('Durable draft receipt upload failed; keep release unpublished')
                  assets.append(durable);observed=remote_state(True,assets,'durable_receipt_while_draft')
                  remote_download(folder,repo,tag,[durable],env,observed['downloads'],save)
                  receipt['durable_receipt_sha256']=digest(durable.read_bytes());done('retain_durable_draft_receipt')
                  stage('promote_verified_draft')
                  current_head(repo,token,commit)
                  remote_state(True,assets,'before_promotion')
                  result=subprocess.run(['gh','release','edit',tag,'--repo',repo,'--draft=false','--prerelease','--latest=false'],capture_output=True,env=env,timeout=60)
                  if result.returncode:raise ValueError('Draft promotion failed; preserve state for review')
                  done('promote_verified_draft')
                  stage('verify_public_downloads')
                  observed=remote_state(False,assets,'published_assets')
                  remote_download(folder,repo,tag,assets,env,observed['downloads'],save);done('verify_public_downloads')
                  receipt['status']='PUBLISHED_AND_DOWNLOADED_BYTES_VERIFIED';receipt['stage']='complete';save()
                  print(json.dumps({'status':receipt['status'],'tag':tag,'source_commit':commit,'archive_sha256':value['archive']['sha256']}))
              except Exception as error:
                  receipt.update(status='INCOMPLETE_OR_FAILED',failed_stage=receipt['stage'],error_type=type(error).__name__)
                  save();raise
          
          
          if __name__=='__main__':publish(Path(os.environ['RELEASE_ASSET_DIR']),dict(os.environ))
          PY
      - name: Retain completed or partial publication evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-receipt.json
          if-no-files-found: error
          retention-days: 90
