# Fresh, isolated installation. Keep live collection disabled until configured.
services:
  db:
    image: postgis/postgis:17-3.6@sha256:1ac10b2551ba84ae05db8e7da477afcd0a3fede99bcb7705da2ee157390cb095
    environment:
      POSTGRES_USER: monitor_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a new POSTGRES_PASSWORD in .env}
      POSTGRES_DB: conflict_monitor
    volumes:
      # A new volume deliberately prevents a silent Bullseye -> Trixie data-directory reuse.
      # Existing installations must follow docs/DB_UPGRADE.md before starting this profile.
      - pgdata17_36:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U monitor_admin -d conflict_monitor"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://monitor_admin:${POSTGRES_PASSWORD}@db:5432/conflict_monitor
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set a separate new 64-character hex POSTGRES_APP_PASSWORD in .env}
      LIVE_INGESTION_ENABLED: "false"
      DEMO_MODE: "false"
    command: [python, -m, app.bootstrap]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  backend:
    build: ./backend
    env_file: ${CONFLICT_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+asyncpg://monitor:${POSTGRES_APP_PASSWORD}@db:5432/conflict_monitor
      # env_file may also contain bootstrap settings. Never expose them to HTTP workers.
      POSTGRES_PASSWORD: ""
      POSTGRES_ADMIN_PASSWORD: ""
      POSTGRES_APP_PASSWORD: ""
      PGPASSWORD: ""
      MIGRATION_DATABASE_URL: ""
      BOOTSTRAP_DATABASE_URL: ""
    volumes:
      - briefing_data:/app/videos/briefing
      - type: bind
        source: ${PIPER_VOICE_DIR:-./artifacts/private/piper-voice}
        target: /opt/voices
        read_only: true
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, "8000", --ws-max-size, "4096"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  pgdata17_36:
  briefing_data:
